# Publish to GitHub

## Purpose

将本地 Git 项目按两阶段流程整理并发布到 GitHub：
1. **格式准备**：检查/生成 README.md、LICENSE、.gitignore
2. **一键发布**：通过 gh CLI 创建仓库、推送、打 tag、创建 Release

## When to use

- 用户要把本地项目上传到 GitHub
- 用户要发布新版本并生成 Release
- 用户的项目缺少 README / LICENSE / .gitignore
- 用户说"发布到 GitHub"、"上传到 GitHub"、"github release"等

## Flow

### Phase 1: GitHub 格式准备

1. 检查项目根目录是否有 `README.md`，没有则根据项目结构自动生成
2. 检查是否有 `LICENSE`，没有则询问用户选择（MIT / Apache-2.0 / GPL-3.0 / 跳过）
3. 检查是否有 `.gitignore`，没有则根据项目语言自动生成
4. 执行 `git add -A` 和 `git commit -m "chore: prepare GitHub-compliant repo structure"`

### Phase 2: 发布到 GitHub

运行 PowerShell 脚本：

```powershell
powershell -ExecutionPolicy Bypass -File .\publish-to-github\scripts\publish_to_github.ps1 `
  -RepoName "owner/repo-name" `
  -Visibility public `
  -Branch main `
  -TagName "v0.1.0" `
  -ReleaseTitle "v0.1.0" `
  -ReleaseNotes "发布的说明"
```

### 询问用户

运行脚本前，确认以下信息：
- 仓库名（owner/repo 格式）
- 可见性（public / private）
- Tag 版本号
- Release 说明

## Safety

- 不覆盖已存在的远程仓库
- 不输出 token、密码或密钥
- 仅 push 当前分支，不影响其他分支
- 所有操作需用户确认后才执行
